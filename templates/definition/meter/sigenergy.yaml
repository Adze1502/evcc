template: sigenergy
products:
  - brand: Sigenergy
    description:
      generic: Sigen Hybrid
  - brand: Sigenergy
    description:
      generic: Sigen PV Max
  - brand: Sigenergy
    description:
      generic: SigenStore EC
capabilities: ["battery-control"]
requirements:
  description:
    de: Modbus TCP muss in der Konfigurations-App aktiviert werden.
    en: Modbus TCP must be enabled in the configuration app. Set Remote EMS mode as operational mode.
params:
  - name: usage
    choice: ["grid", "pv", "battery"]
  - name: host
  - name: port
    default: 502
  - name: id
    default: 1
  - name: maxacpower
  - name: maxchargepower
    default: 800
    required: true
    usages: ["battery"]
  - name: maxdischargepower
    default: 800
    required: true
    usages: ["battery"]
  - preset: battery-params
render: |
  type: custom
  {{- if eq .usage "grid" }}
  power:
    source: modbus
    uri: {{ joinHostPort .host .port }}
    id: 247
    register:
      address: 30005 # [Grid sensor] Active power
      type: holding
      decode: int32
  energy:
    source: modbus
    uri: {{ joinHostPort .host .port }}
    id: {{ .id }}
    register:
      address: 30562 # Accumulated import energy
      type: holding
      decode: uint64
    scale: 0.01
  currents:
    - source: modbus
      uri: {{ joinHostPort .host .port }}
      id: {{ .id }}
      register:
        address: 31017 # Phase A current
        type: holding
        decode: int32
      scale: 0.01
    - source: modbus
      uri: {{ joinHostPort .host .port }}
      id: {{ .id }}
      register:
        address: 31019 # Phase B current
        type: holding
        decode: int32
      scale: 0.01
    - source: modbus
      uri: {{ joinHostPort .host .port }}
      id: {{ .id }}
      register:
        address: 31021 # Phase C current
        type: holding
        decode: int32
      scale: 0.01
  {{- end }}
  {{- if eq .usage "pv" }}
  power:
    source: modbus
    uri: {{ joinHostPort .host .port }}
    id: {{ .id }}
    register:
      type: holding
      address: 31035 # PV power (per inverter)
      decode: int32
  maxacpower: {{ .maxacpower }} # W
  {{- end }}
  {{- if eq .usage "battery" }}
  power:
    source: modbus
    uri: {{ joinHostPort .host .port }}
    id: {{ .id }}
    register:
      type: holding
      address: 30599 # [ESS] Charge/discharge power (per inverter)
      decode: int32
    scale: -1
  energy:
    source: modbus
    uri: {{ joinHostPort .host .port }}
    id: {{ .id }}
    register:
      address: 30574 # [ESS] Accumulated discharge energy (per inverter)
      type: holding
      decode: uint64
    scale: 0.01
  returnenergy:
    source: modbus
    uri: {{ joinHostPort .host .port }}
    id: {{ .id }}
    register:
      address: 30568 # [ESS] Accumulated charge energy (per inverter)
      type: holding
      decode: uint64
    scale: 0.01
  soc:
    source: modbus
    uri: {{ joinHostPort .host .port }}
    id: {{ .id }}
    register:
      address: 30601 # [ESS] Battery SOC (per inverter)
      type: holding
      decode: uint16
    scale: 0.1
  batterymode:
    source: switch
    switch:
      # EVCC mode 1: normal
      - case: 1
        set:
          source: sequence
          set:
            # Maximum self-consumption
            - source: const
              value: 2
              set:
                source: modbus
                uri: {{ joinHostPort .host .port }}
                id: 247
                register:
                  address: 40031
                  type: writesingle
                  decode: uint16
      # EVCC mode 2: hold
      - case: 2
        set:
          source: sequence
          set:
            # Standby
            - source: const
              value: 1
              set:
                source: modbus
                uri: {{ joinHostPort .host .port }}
                id: 247
                register:
                  address: 40031
                  type: writesingle
                  decode: uint16
      # EVCC mode 3: charge
      - case: 3
        set:
          source: sequence
          set:
            # Set maximum charge power
            - source: const
              value: {{ .maxchargepower }}
              set:
                source: modbus
                uri: {{ joinHostPort .host .port }}
                id: 247
                register:
                  address: 40032
                  type: writemultiple
                  decode: uint32
            # Command charging - grid first
            - source: const
              value: 3
              set:
                source: modbus
                uri: {{ joinHostPort .host .port }}
                id: 247
                register:
                  address: 40031
                  type: writesingle
                  decode: uint16
      # EVCC mode 4: holdcharge
      - case: 4
        set:
          source: sequence
          set:
            # Set maximum charge power
            - source: const
              value: {{ .maxchargepower }}
              set:
                source: modbus
                uri: {{ joinHostPort .host .port }}
                id: 247
                register:
                  address: 40032
                  type: writemultiple
                  decode: uint32
            # Command charging - PV first
            - source: const
              value: 4
              set:
                source: modbus
                uri: {{ joinHostPort .host .port }}
                id: 247
                register:
                  address: 40031
                  type: writesingle
                  decode: uint16
      # EVCC mode 5: discharge
      - case: 5
        set:
          source: sequence
          set:
            # Set maximum discharge power
            - source: const
              value: {{ .maxdischargepower }}
              set:
                source: modbus
                uri: {{ joinHostPort .host .port }}
                id: 247
                register:
                  address: 40034
                  type: writemultiple
                  decode: uint32
            # Command discharging - ESS first
            - source: const
              value: 6
              set:
                source: modbus
                uri: {{ joinHostPort .host .port }}
                id: 247
                register:
                  address: 40031
                  type: writesingle
                  decode: uint16
  {{- include "battery-params" . }}
  {{- end }}
